<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Popup as Tab Manual Test</title>
    <style>
      :root { font-family: system-ui, sans-serif; color: #18201b; background: #f5f7f5; }
      body { max-width: 560px; margin: 60px auto; padding: 24px; }
      main { padding: 24px; border: 1px solid #dce2dd; border-radius: 12px; background: #fff; }
      h1 { margin-top: 0; font-size: 22px; }
      p { line-height: 1.6; }
      button { padding: 10px 16px; border: 0; border-radius: 8px; color: #fff; background: #16803c; font: inherit; font-weight: 700; cursor: pointer; }
    </style>
  </head>
  <body>
    <main>
      <h1>Popup as Tab Manual Test</h1>
      <p id="guide">Click the button below. The test passes if the popup moves directly to the right of this tab and becomes active.</p>
      <button id="open-popup" type="button">Open test popup</button>
    </main>
    <script src="manual-test.js"></script>
  </body>
</html>
